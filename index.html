<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Bitzee Aquarium - Playable</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0a1a;
    touch-action: none;
  }
  #game-container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<div id="game-container"></div>

<!-- Swap for a bundled/local copy before shipping to an ad network -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------
  // CONFIG
  // ---------------------------------------------------------------------
  const DESIGN_WIDTH = 640;
  const DESIGN_HEIGHT = 1136;

  const GAME_DURATION = 10; // seconds, per minigame

  const PALETTE = {
    bgTop: 0x2fbcd4,
    bgBottom: 0x0d1b3f,
    tankPurple: 0x6c4fd6,
    heartRed: 0xe94f6b,
    bubbleBlue: 0x7fd4ff,
    gold: 0xffc94a,
  };

  // ---------------------------------------------------------------------
  // APP / BOOT
  // ---------------------------------------------------------------------
  const app = new PIXI.Application({
    width: DESIGN_WIDTH,
    height: DESIGN_HEIGHT,
    backgroundColor: PALETTE.bgBottom,
    antialias: true,
    resolution: Math.min(window.devicePixelRatio || 1, 2),
    autoDensity: true,
  });

  document.getElementById("game-container").appendChild(app.view);

  function resize() {
    const scale = Math.min(
      window.innerWidth / DESIGN_WIDTH,
      window.innerHeight / DESIGN_HEIGHT
    );
    app.view.style.width = `${DESIGN_WIDTH * scale}px`;
    app.view.style.height = `${DESIGN_HEIGHT * scale}px`;
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------------------------------------------------------------------
  // LIGHTWEIGHT TWEEN HELPER
  // No external tween lib — keeps bundle size down, which matters for
  // ad-network file-size caps. Good enough for juice: scale/alpha/position.
  // ---------------------------------------------------------------------
  const Tween = {
    _active: [],

    to(target, props, duration, easing = Tween.easeOutQuad, onComplete) {
      const start = {};
      for (const key in props) start[key] = target[key];
      const tweenObj = { target, start, props, duration, elapsed: 0, easing, onComplete };
      Tween._active.push(tweenObj);
      return tweenObj;
    },

    update(deltaMS) {
      const dt = deltaMS / 1000;
      for (let i = Tween._active.length - 1; i >= 0; i--) {
        const t = Tween._active[i];
        t.elapsed += dt;
        const progress = Math.min(t.elapsed / t.duration, 1);
        const eased = t.easing(progress);
        for (const key in t.props) {
          t.target[key] = t.start[key] + (t.props[key] - t.start[key]) * eased;
        }
        if (progress >= 1) {
          Tween._active.splice(i, 1);
          if (t.onComplete) t.onComplete();
        }
      }
    },

    easeOutQuad: (t) => 1 - (1 - t) * (1 - t),
    easeOutBack: (t) => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    },
    easeOutElastic: (t) => {
      const c4 = (2 * Math.PI) / 3;
      return t === 0 ? 0 : t === 1 ? 1
        : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
    },
  };

  // NOTE: ticker.add() callbacks receive a normalized delta number, not a
  // Ticker object — read deltaMS off app.ticker directly instead.
  app.ticker.add(() => Tween.update(app.ticker.deltaMS));

  // ---------------------------------------------------------------------
  // PLACEHOLDER ASSET FACTORY
  // Swap these for real sprite-sheet textures once art lands. Keeping
  // generation centralized here means only this section changes later.
  // ---------------------------------------------------------------------
  const Assets = {
    circle(radius, color, alpha = 1) {
      const g = new PIXI.Graphics();
      g.beginFill(color, alpha);
      g.drawCircle(0, 0, radius);
      g.endFill();
      return app.renderer.generateTexture(g);
    },
    roundedRect(w, h, radius, color) {
      const g = new PIXI.Graphics();
      g.beginFill(color);
      g.drawRoundedRect(0, 0, w, h, radius);
      g.endFill();
      return app.renderer.generateTexture(g);
    },
  };

  // ---------------------------------------------------------------------
  // SHARED UI: heart meter + countdown timer
  // Both minigame scenes read/write these via SceneManager.hud
  // ---------------------------------------------------------------------
  class HeartMeter extends PIXI.Container {
    constructor() {
      super();
      this.maxValue = 3; // e.g. 3 completed games = full heart -> evolution
      this.value = 0;

      this.outline = new PIXI.Graphics();
      this.fill = new PIXI.Graphics();
      this.addChild(this.fill, this.outline);
      this._drawHeartPath(this.outline, PALETTE.heartRed, false);
      this._redrawFill();
    }

    _heartPoints() {
      // Simple heart silhouette via bezier-ish polygon; swap for a sprite later.
      return null;
    }

    _drawHeartPath(g, color, filled) {
      g.clear();
      g.lineStyle(filled ? 0 : 4, color, 1);
      if (filled) g.beginFill(color);
      g.moveTo(0, 12);
      g.bezierCurveTo(-30, -20, -60, 10, 0, 50);
      g.bezierCurveTo(60, 10, 30, -20, 0, 12);
      if (filled) g.endFill();
    }

    _redrawFill() {
      const pct = this.value / this.maxValue;
      const mask = new PIXI.Graphics();
      mask.beginFill(0xffffff);
      mask.drawRect(-60, 50 - 70 * pct, 120, 70 * pct);
      mask.endFill();
      this._drawHeartPath(this.fill, PALETTE.heartRed, true);
      this.fill.mask = mask;
      this.addChild(mask);
    }

    increment(amount = 1) {
      this.value = Math.min(this.value + amount, this.maxValue);
      this._redrawFill();
      return this.value >= this.maxValue;
    }
  }

  class CountdownTimer extends PIXI.Container {
    constructor(seconds) {
      super();
      this.remaining = seconds;
      this.label = new PIXI.Text(`${Math.ceil(this.remaining)}`, {
        fontFamily: "Arial",
        fontSize: 42,
        fontWeight: "bold",
        fill: 0xffffff,
        stroke: 0x000000,
        strokeThickness: 4,
      });
      this.label.anchor.set(0.5);
      this.addChild(this.label);
      this._onComplete = null;
    }

    start(onComplete) {
      this._onComplete = onComplete;
      this._done = false;
    }

    update(deltaMS) {
      if (this._done) return;
      this.remaining -= deltaMS / 1000;
      this.label.text = `${Math.max(Math.ceil(this.remaining), 0)}`;
      if (this.remaining <= 0) {
        this._done = true;
        if (this._onComplete) this._onComplete();
      }
    }
  }

  // ---------------------------------------------------------------------
  // SCENE BASE CLASS
  // ---------------------------------------------------------------------
  class Scene extends PIXI.Container {
    constructor(manager) {
      super();
      this.manager = manager;
    }
    // Called after the scene is added to the stage and transition-in starts
    onEnter() {}
    // Called before the scene is removed
    onExit() {}
    // Called every tick while active
    update(deltaMS) {}
  }

  // ---------------------------------------------------------------------
  // SCENE MANAGER — handles switching + a simple fade transition
  // ---------------------------------------------------------------------
  class SceneManager {
    constructor(app) {
      this.app = app;
      this.current = null;
      this.hud = { heart: null }; // shared across gameplay scenes

      this.overlay = new PIXI.Graphics();
      this.overlay.beginFill(0x000000);
      this.overlay.drawRect(0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);
      this.overlay.endFill();
      this.overlay.alpha = 0;
      this.overlay.eventMode = "none";

      app.ticker.add(() => {
        if (this.current && this.current.update) {
          this.current.update(app.ticker.deltaMS);
        }
      });
    }

    goTo(SceneClass, options = {}) {
      const incoming = new SceneClass(this, options);

      const finishSwap = () => {
        if (this.current) {
          this.current.onExit();
          this.app.stage.removeChild(this.current);
          this.current.destroy({ children: true });
        }
        this.app.stage.addChildAt(incoming, 0);
        this.current = incoming;
        incoming.onEnter();

        this.overlay.alpha = 1;
        this.app.stage.addChild(this.overlay);
        Tween.to(this.overlay, { alpha: 0 }, 0.35, Tween.easeOutQuad, () => {
          this.app.stage.removeChild(this.overlay);
        });
      };

      if (!this.current) {
        finishSwap();
        return;
      }

      this.overlay.alpha = 0;
      this.app.stage.addChild(this.overlay);
      Tween.to(this.overlay, { alpha: 1 }, 0.25, Tween.easeOutQuad, finishSwap);
    }
  }

  // ---------------------------------------------------------------------
  // BACKGROUND HELPER — reused across every scene (sky gradient + tank)
  // ---------------------------------------------------------------------
  function buildBackdrop() {
    const container = new PIXI.Container();

    const sky = new PIXI.Graphics();
    sky.beginFill(PALETTE.bgTop);
    sky.drawRect(0, 0, DESIGN_WIDTH, DESIGN_HEIGHT * 0.55);
    sky.endFill();
    sky.beginFill(PALETTE.bgBottom);
    sky.drawRect(0, DESIGN_HEIGHT * 0.55, DESIGN_WIDTH, DESIGN_HEIGHT * 0.45);
    sky.endFill();
    container.addChild(sky);

    const tank = new PIXI.Graphics();
    tank.beginFill(PALETTE.tankPurple, 0.85);
    tank.drawRoundedRect(60, DESIGN_HEIGHT * 0.28, DESIGN_WIDTH - 120, DESIGN_HEIGHT * 0.4, 40);
    tank.endFill();
    container.addChild(tank);

    return container;
  }

  function buildLabel(text, y) {
    const label = new PIXI.Text(text, {
      fontFamily: "Arial",
      fontSize: 30,
      fontWeight: "bold",
      fill: 0xffffff,
      stroke: 0x000000,
      strokeThickness: 5,
      align: "center",
    });
    label.anchor.set(0.5);
    label.x = DESIGN_WIDTH / 2;
    label.y = y;
    return label;
  }

  // ---------------------------------------------------------------------
  // SCENE 1 — CHARACTER SELECT (stub: turtle only, per brief)
  // ---------------------------------------------------------------------
  class CharacterSelectScene extends Scene {
    onEnter() {
      this.addChild(buildBackdrop());
      this.addChild(buildLabel("PLAY TO UNLOCK MORE", DESIGN_HEIGHT * 0.85));

      const turtle = new PIXI.Sprite(Assets.circle(50, 0x3fae7a));
      turtle.anchor.set(0.5);
      turtle.x = DESIGN_WIDTH / 2;
      turtle.y = DESIGN_HEIGHT * 0.42;
      turtle.eventMode = "static";
      turtle.cursor = "pointer";
      this.addChild(turtle);

      turtle.on("pointertap", () => {
        this.manager.goTo(ColorPickerScene);
      });

      turtle.scale.set(0);
      Tween.to(turtle.scale, { x: 1, y: 1 }, 0.5, Tween.easeOutBack);
    }
  }

  // ---------------------------------------------------------------------
  // SCENE 2 — COLOR PICKER (stub)
  // ---------------------------------------------------------------------
  class ColorPickerScene extends Scene {
    onEnter() {
      this.addChild(buildBackdrop());
      this.addChild(buildLabel("CHANGE THE\nAQUARIUM COLOUR", DESIGN_HEIGHT * 0.85));

      const colors = [0x8f7bd6, 0xff9a4d, 0x4dd68f];
      colors.forEach((color, i) => {
        const swatch = new PIXI.Sprite(Assets.circle(30, color));
        swatch.anchor.set(0.5);
        swatch.x = DESIGN_WIDTH / 2 + (i - 1) * 90;
        swatch.y = DESIGN_HEIGHT * 0.25;
        swatch.eventMode = "static";
        swatch.cursor = "pointer";
        swatch.on("pointertap", () => this.manager.goTo(BubbleGameScene));
        this.addChild(swatch);
      });
    }
  }

  // ---------------------------------------------------------------------
  // SCENE 3 — BUBBLE POP GAME (fully functional — this is the polish showcase)
  // ---------------------------------------------------------------------
  class BubbleGameScene extends Scene {
    constructor(manager) {
      super(manager);
      this.bubbles = [];
      this.spawnTimer = 0;
      this.spawnInterval = 0.8;
    }

    onEnter() {
      this.addChild(buildBackdrop());

      this.heart = this.manager.hud.heart || new HeartMeter();
      this.manager.hud.heart = this.heart;
      this.heart.x = DESIGN_WIDTH / 2;
      this.heart.y = 90;
      this.addChild(this.heart);

      this.instructionLabel = buildLabel("TIME TO PLAY!", DESIGN_HEIGHT * 0.85);
      this.addChild(this.instructionLabel);

      // Brief pre-roll before the timer starts, matching "TIME TO PLAY!" frame
      setTimeout(() => this._beginTimedRound(), 1200);
    }

    _beginTimedRound() {
      this.instructionLabel.text = "TAP THE BUBBLES";
      this.timer = new CountdownTimer(GAME_DURATION);
      this.timer.x = DESIGN_WIDTH / 2;
      this.timer.y = DESIGN_HEIGHT * 0.22;
      this.addChild(this.timer);
      this.timer.start(() => this._onRoundComplete());
      this.roundActive = true;
    }

    _spawnBubble() {
      const bubble = new PIXI.Sprite(Assets.circle(28, PALETTE.bubbleBlue, 0.85));
      bubble.anchor.set(0.5);
      bubble.x = DESIGN_WIDTH / 2 + (Math.random() - 0.5) * 300;
      bubble.y = DESIGN_HEIGHT * 0.55;
      bubble.eventMode = "static";
      bubble.cursor = "pointer";
      bubble.scale.set(0);

      Tween.to(bubble.scale, { x: 1, y: 1 }, 0.3, Tween.easeOutBack);
      // Idle bob for a bit of life while waiting to be popped
      bubble._bobPhase = Math.random() * Math.PI * 2;

      bubble.on("pointertap", () => this._popBubble(bubble));

      this.bubbles.push(bubble);
      this.addChild(bubble);
    }

    _popBubble(bubble) {
      if (bubble._popped) return;
      bubble._popped = true;
      bubble.eventMode = "none";

      // Juice: quick squash then scale-burst + fade, plus a tiny particle ring
      Tween.to(bubble.scale, { x: 1.4, y: 1.4 }, 0.15, Tween.easeOutQuad);
      Tween.to(bubble, { alpha: 0 }, 0.2, Tween.easeOutQuad, () => {
        this.removeChild(bubble);
        this.bubbles = this.bubbles.filter((b) => b !== bubble);
      });

      this._spawnPopParticles(bubble.x, bubble.y);
      this.heart.increment(0.05);
    }

    _spawnPopParticles(x, y) {
      for (let i = 0; i < 6; i++) {
        const p = new PIXI.Sprite(Assets.circle(4, 0xffffff));
        p.anchor.set(0.5);
        p.x = x;
        p.y = y;
        this.addChild(p);
        const angle = (Math.PI * 2 * i) / 6;
        Tween.to(p, { x: x + Math.cos(angle) * 40, y: y + Math.sin(angle) * 40, alpha: 0 }, 0.4, Tween.easeOutQuad, () => {
          this.removeChild(p);
        });
      }
    }

    _onRoundComplete() {
      this.roundActive = false;
      this.bubbles.forEach((b) => this.removeChild(b));
      this.bubbles = [];
      if (this.timer) this.removeChild(this.timer);
      this.instructionLabel.text = "GREAT JOB!";
      setTimeout(() => this.manager.goTo(FeedGameScene), 1000);
    }

    update(deltaMS) {
      if (!this.roundActive) return;
      this.timer.update(deltaMS);

      this.spawnTimer += deltaMS / 1000;
      if (this.spawnTimer >= this.spawnInterval && this.bubbles.length < 4) {
        this.spawnTimer = 0;
        this._spawnBubble();
      }

      const t = performance.now() / 1000;
      this.bubbles.forEach((b) => {
        if (!b._popped) b.y += Math.sin(t * 2 + b._bobPhase) * 0.3;
      });
    }
  }

  // ---------------------------------------------------------------------
  // SCENE 4 — FEED GAME (stub — wire up swipe-catch logic here)
  // ---------------------------------------------------------------------
  class FeedGameScene extends Scene {
    onEnter() {
      this.addChild(buildBackdrop());
      this.addChild(buildLabel("TIME TO FEED!", DESIGN_HEIGHT * 0.85));
      // TODO: spawn shrinking food pellet, swipe-left/right catch logic,
      // reuse CountdownTimer + this.manager.hud.heart as in BubbleGameScene.
      setTimeout(() => this.manager.goTo(HoopGameScene), 1500);
    }
  }

  // ---------------------------------------------------------------------
  // SCENE 5 — HOOP GAME (stub — wire up swipe up/down guidance here)
  // ---------------------------------------------------------------------
  class HoopGameScene extends Scene {
    onEnter() {
      this.addChild(buildBackdrop());
      this.addChild(buildLabel("GO THROUGH HOOPS", DESIGN_HEIGHT * 0.85));
      // TODO: hoop spawn/scroll logic, drag-to-move turtle, collision check.
      setTimeout(() => this.manager.goTo(EvolutionScene), 1500);
    }
  }

  // ---------------------------------------------------------------------
  // SCENE 6 — EVOLUTION MOMENT (stub — sparkle celebration)
  // ---------------------------------------------------------------------
  class EvolutionScene extends Scene {
    onEnter() {
      this.addChild(buildBackdrop());
      this.addChild(buildLabel("WOW!", DESIGN_HEIGHT * 0.85));
      // TODO: sparkle particle burst, scale/glow tween on the pet sprite,
      // then auto-advance to the end card.
      setTimeout(() => this.manager.goTo(EndCardScene), 2000);
    }
  }

  // ---------------------------------------------------------------------
  // SCENE 7 — END CARD (stub — TVC / product shot / replay / clickthrough)
  // ---------------------------------------------------------------------
  class EndCardScene extends Scene {
    onEnter() {
      this.addChild(buildBackdrop());
      this.addChild(buildLabel("MORE UNLOCKED!", DESIGN_HEIGHT * 0.6));

      const replay = new PIXI.Sprite(Assets.roundedRect(160, 60, 16, 0x8f7bd6));
      replay.anchor.set(0.5);
      replay.x = DESIGN_WIDTH / 2 - 100;
      replay.y = DESIGN_HEIGHT * 0.75;
      replay.eventMode = "static";
      replay.cursor = "pointer";
      replay.on("pointertap", () => this.manager.goTo(CharacterSelectScene));
      this.addChild(replay);

      const learnMore = new PIXI.Sprite(Assets.roundedRect(160, 60, 16, PALETTE.gold));
      learnMore.anchor.set(0.5);
      learnMore.x = DESIGN_WIDTH / 2 + 100;
      learnMore.y = DESIGN_HEIGHT * 0.75;
      learnMore.eventMode = "static";
      learnMore.cursor = "pointer";
      // Clickthrough — real ad networks expose their own API for this
      // (e.g. MRAID's mraid.open(), or a network-specific click macro).
      learnMore.on("pointertap", () => console.log("clickthrough fired"));
      this.addChild(learnMore);
    }
  }

  // ---------------------------------------------------------------------
  // BOOT
  // ---------------------------------------------------------------------
  const sceneManager = new SceneManager(app);
  sceneManager.goTo(CharacterSelectScene);
})();
</script>
</body>
</html>
